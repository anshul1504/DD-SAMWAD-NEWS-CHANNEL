name: CI

# A branch once reached production review with three failing tests and five
# missing templates. This pipeline exists to make that impossible again.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Test-only values. No production secret is required to run this pipeline,
      # and none should ever be added: CI must stay runnable from a fork.
      DEBUG: "False"
      SECRET_KEY: "ci-only-not-a-real-secret-key-0123456789abcdefghijklmnopqrstuvwxyz"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
      # HTTPS-dependent settings are exercised separately in the deploy-check
      # step; leaving them off here keeps the Django test client on plain HTTP.
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Create cache table
        # The database cache backend is used whenever REDIS_URL is unset. Without
        # this table every cache read fails, which would break throttling tests.
        run: python manage.py createcachetable

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity=2

      - name: Collect static
        # Proves WhiteNoise's storage backend can process every asset, which is
        # otherwise only discovered at deploy time.
        run: python manage.py collectstatic --noinput

      - name: Deployment checks (production-like)
        # Runs with the HTTPS settings a real deployment uses. SECURE_HSTS_PRELOAD
        # stays off deliberately: preload submission is hard to reverse and is an
        # explicit operator decision, so W021 is the one expected warning.
        env:
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          ALLOWED_HOSTS: "deshdarpansamvad.com"
        run: python manage.py check --deploy --fail-level ERROR

  backup-script:
    name: Backup script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: bash -n scripts/backup.sh

      - name: Backup produces a restorable snapshot
        # End-to-end proof: build a throwaway database, back it up, and confirm
        # the snapshot opens and still contains the row. A backup that has never
        # been restored is not a backup.
        run: |
          set -euo pipefail
          python -c "
          import sqlite3
          c = sqlite3.connect('db.sqlite3')
          c.execute('CREATE TABLE canary (id INTEGER PRIMARY KEY, note TEXT)')
          c.execute(\"INSERT INTO canary (note) VALUES ('survives-restore')\")
          c.commit(); c.close()
          "
          mkdir -p media && echo "asset" > media/example.txt
          BACKUP_DIR="${PWD}/ci-backups" bash scripts/backup.sh
          SNAPSHOT="$(find ci-backups -name db.sqlite3 | head -1)"
          test -n "${SNAPSHOT}"
          python -c "
          import sqlite3, sys
          row = sqlite3.connect('${SNAPSHOT}').execute('SELECT note FROM canary').fetchone()
          assert row and row[0] == 'survives-restore', row
          print('restore verified:', row[0])
          "
          test -f "$(dirname "${SNAPSHOT}")/media.tar.gz"
          ! tar -tzf "$(dirname "${SNAPSHOT}")/media.tar.gz" | grep -q '\.env'
          echo "backup script verified"
