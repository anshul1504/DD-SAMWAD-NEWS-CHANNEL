{% load static %}
<header class="brand-header">
  <div class="dds-container brand-header-inner">
    <button class="menu-button d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-label="मेनू खोलें">
      <span></span><span></span><span></span>
    </button>
    <a class="brand-mark" href="{% url 'home' %}" aria-label="Desh Darpan Samvad home">
      {% if site_settings.logo %}
        <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}">
      {% else %}
        <img src="{% static 'images/dds-logo.svg' %}" alt="Desh Darpan Samvad">
      {% endif %}
    </a>
    <form class="header-search" action="{% url 'news:search' %}">
      <label class="visually-hidden" for="global-search">खबर खोजें</label>
      <span class="search-icon" aria-hidden="true"></span>
      <input id="global-search" name="q" value="{{ query|default:'' }}" type="search" placeholder="खबर, शहर या विषय खोजें">
      <button type="submit" aria-label="खोजें">Search</button>
    </form>
    <div class="header-cta">
      <a class="edition-chip" href="{% url 'news:latest' %}">लाइव अपडेट</a>
      <a class="account-link" href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'accounts:login' %}{% endif %}">{% if user.is_authenticated %}Portal{% else %}Sign In{% endif %}</a>
    </div>
  </div>
</header>
