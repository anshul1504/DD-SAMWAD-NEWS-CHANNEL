{% extends "base.html" %}
{% block content %}
<section class="dds-container contact-page">

    <span>Contact</span>
    <h1>न्यूजरूम से संपर्क करें</h1>
    <p>समाचार, विज्ञापन, शिकायत या सुझाव के लिए अपना संदेश भेजें।</p>

{% endblock %}
