{% extends "erp/auth/base_auth.html" %}
{% block auth_content %}
<span class="auth-kicker">Password help</span>
<h2>Forgot password?</h2>
<p>Enter your registered email. We will verify ownership with OTP first.</p>
<form class="auth-form" method="post">
  {% csrf_token %}
  <div class="field"><label for="{{ form.email.id_for_label }}">Email address</label>{{ form.email }}{{ form.email.errors }}</div>
  <button class="auth-submit" type="submit">Send Reset OTP</button>
</form>
<div class="auth-links"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
{% endblock %}
