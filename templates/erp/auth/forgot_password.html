{% extends "erp/auth/base_auth.html" %}
{% block auth_content %}
<span class="auth-kicker">Reset access</span>
<h2>Forgot password?</h2>
<p class="auth-sub">Enter your registered email and we'll send you a one-time code to reset your password.</p>
<form class="auth-form" method="post">
  {% csrf_token %}
  <div class="field">
    <label for="{{ form.email.id_for_label }}">Email address</label>
    {{ form.email }}
    {{ form.email.errors }}
  </div>
  <button class="auth-submit" type="submit">Send reset code</button>
</form>
<a class="auth-back-link" href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left"></i> Back to sign in</a>
{% endblock %}
