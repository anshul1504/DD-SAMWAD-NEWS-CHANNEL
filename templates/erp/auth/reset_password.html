{% extends "erp/auth/base_auth.html" %}
{% block auth_content %}
<span class="auth-kicker">Reset password</span>
<h2>Create new password</h2>
<p>Choose a strong password for your ERP portal account.</p>
<form class="auth-form" method="post">
  {% csrf_token %}
  <div class="field"><label for="{{ form.password.id_for_label }}">New password</label>{{ form.password }}{{ form.password.errors }}</div>
  <div class="field"><label for="{{ form.confirm_password.id_for_label }}">Confirm password</label>{{ form.confirm_password }}{{ form.confirm_password.errors }}</div>
  <button class="auth-submit" type="submit">Update Password</button>
</form>
{% endblock %}
