<div style="margin:0;padding:24px;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e2e8f0;">
    {% include "emails/_header.html" %}
    <div style="padding:28px;">
      <span style="display:inline-block;background:#eef4ff;color:#0b3474;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;">Secure Verification</span>
      <p style="margin:16px 0 12px;font-size:15px;color:#344054;">आपका वेरिफिकेशन कोड (OTP):</p>
      <div style="letter-spacing:8px;font-size:34px;font-weight:800;color:#e31e28;background:#fff5f5;border-radius:12px;padding:16px;text-align:center;">{{ otp.code }}</div>
      <p style="margin:18px 0 0;color:#64748b;line-height:1.6;font-size:13.5px;">
        यह OTP <strong>10 मिनट</strong> तक मान्य है। अगर आपने यह अनुरोध नहीं किया है, तो इस ईमेल को नज़रअंदाज़ करें — आपका अकाउंट सुरक्षित है।
      </p>
    </div>
    {% include "emails/_footer.html" %}
  </div>
</div>
